    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600&display=swap">
    <link rel="stylesheet" href="css/app.css">
    <script>
    // ── CONFIG FIREBASE (non secrète : la sécurité vient des règles Firestore) ──
    const FIREBASE_CONFIG = {
        apiKey:            "AIzaSyBjcKrdngNQxm152Wcyu5dqHcg3gPDwttE",
        authDomain:        "lisa-cmpt.firebaseapp.com",
        projectId:         "lisa-cmpt",
        storageBucket:     "lisa-cmpt.firebasestorage.app",
        messagingSenderId: "868775649067",
        appId:             "1:868775649067:web:2b48bbe124cb93ade66f6e"
    };

    // Halos du fond calés sur l'HORLOGE (même principe que commun.js de PORTAIL-DUO) : délai négatif
    // = −(maintenant modulo un aller-retour), pour que l'animation ne reparte pas de zéro à chaque
    // ouverture. Aller-retour = 2 × durée des animations de css/app.css (23 s et 31 s) — à changer ENSEMBLE.
    (function () {
        const racine = document.documentElement;
        const caler = () => {
            const t = Date.now();
            racine.style.setProperty('--v-delai-profil', (-(t % 46000) / 1000) + 's');
            racine.style.setProperty('--v-delai-app', (-(t % 62000) / 1000) + 's');
        };
        caler();
        addEventListener('pageshow', e => { if (e.persisted) caler(); });

        // Préférences d'affichage de CET appareil (Paramètres → Apparence), appliquées avant le premier
        // affichage : intensité du flou du verre, animations entre onglets. Même formule que js/ui/prefs.js.
        try {
            const p = JSON.parse(localStorage.getItem('tw-apparence') || '{}') || {};
            let l = Math.max(0, Math.min(100, Math.round(Number(p.flou ?? 50))));
            if (!Number.isFinite(l)) l = 50;
            if (l !== 50) racine.style.setProperty('--v-flou', l === 0 ? 'none' : 'blur(' + (l * 0.6).toFixed(1) + 'px) saturate(' + (100 + l * 1.6).toFixed(0) + '%)');
            if (p.animations === false) racine.dataset.animations = 'off';
            if (p.theme === 'neo') {                   // thème Neumorphisme (Paramètres → Apparence)
                racine.dataset.theme = 'neo';
                racine.style.setProperty('--v-flou', 'none');
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1f232a');
            }
        } catch { /* stockage indisponible : valeurs par défaut */ }
    })();
    </script>
    <script type="module">
        // Démarrage surveillé : si un fichier de l'app est encore dans le cache HTTP (GitHub Pages : 10 min)
        // dans une version incompatible, on force leur re-téléchargement puis on recharge une seule fois.
        import('./js/app.js').then(() => sessionStorage.removeItem('tw-reload')).catch(async err => {
            console.error('[démarrage]', err);
            const say = (msg, err2) => {
                document.getElementById('login-msg').textContent = msg;
                document.getElementById('login-err').textContent = err2 || '';
            };
            if (!sessionStorage.getItem('tw-reload')) {
                sessionStorage.setItem('tw-reload', '1');
                say('Mise à jour de l\'application…');
                try {
                    const sw = await (await fetch('./sw.js', { cache: 'reload' })).text();
                    const files = (sw.match(/'\.\/[^']*'/g) || []).map(s => s.slice(1, -1));
                    await Promise.all(files.map(f => fetch(f, { cache: 'reload' }).catch(() => null)));
                } catch { /* hors ligne : on recharge quand même */ }
                location.reload();
                return;
            }
            sessionStorage.removeItem('tw-reload');
            say('', 'L\'application n\'a pas pu démarrer (' + (err.message || err) + ').\nVérifie la connexion puis recharge avec Ctrl+F5.');
        });
    </script>
</head>
