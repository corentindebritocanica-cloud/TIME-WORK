<!DOCTYPE html>

<head>

    <meta name="theme-color" content="#0b1628">

    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/app.css">

    <script type="module">
        // Démarrage surveillé : si un fichier de l'app est encore dans le cache HTTP (GitHub Pages : 10 min)
        // dans une version incompatible, on force leur re-téléchargement puis on recharge une seule fois.
        import('./js/app.js').then(() => sessionStorage.removeItem('tw-reload')).catch(async err => {
            console.error('[démarrage]', err);
            const say = (msg, err2) => {
                document.getElementById('login-msg').textContent = msg;
                document.getElementById('login-err').textContent = err2 || '';
            };
            if (!sessionStorage.getItem('tw-reload')) {
                sessionStorage.setItem('tw-reload', '1');
                say('Mise à jour de l\'application…');
                try {
                    const sw = await (await fetch('./sw.js', { cache: 'reload' })).text();
                    const files = (sw.match(/'\.\/[^']*'/g) || []).map(s => s.slice(1, -1));
                    await Promise.all(files.map(f => fetch(f, { cache: 'reload' }).catch(() => null)));
                } catch { /* hors ligne : on recharge quand même */ }
                location.reload();
                return;
            }
            sessionStorage.removeItem('tw-reload');
            say('', 'L\'application n\'a pas pu démarrer (' + (err.message || err) + ').\nVérifie la connexion puis recharge avec Ctrl+F5.');
        });
    </script>
</head>
<body>
<a class="skip-link" href="#main">Aller au contenu</a>

<svg class="sr-only" aria-hidden="true" focusable="false">
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<header class="app-header">
    <a class="brand" href="#/suivi/dashboard" aria-label="TIME-WORK — tableau de bord"><svg aria-hidden="true"><use href="#icon-clock"/></svg><span>TIME-WORK</span></a>
    <div class="header-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="quick-btn" aria-keyshortcuts="Control+K" title="Saisie rapide (Ctrl+K)">+<span class="vh-narrow"> Saisie rapide</span> <span class="kbd hide-narrow">Ctrl K</span></button>
        <button type="button" class="btn btn-ghost btn-sm" id="data-btn" popovertarget="data-menu" title="Sauvegarde et import"><span aria-hidden="true">💾</span><span class="vh-narrow"> Données</span></button>
        <div id="data-menu" class="menu" popover>
            <button type="button" class="menu-item" data-action="export">💾 Sauvegarder (JSON)</button>
            <button type="button" class="menu-item" data-action="pick-json">📂 Restaurer une sauvegarde</button>
            <button type="button" class="menu-item" data-action="pick-csv">📊 Importer un historique CSV</button>
            <input type="file" accept=".json,application/json" data-action="import-json" hidden>
            <input type="file" accept=".csv,.txt,text/csv" data-action="import-csv" hidden>
        </div>
        <span id="sync" class="sync" role="status" hidden><span id="sync-txt" class="vh-narrow">Synchronisé</span><span id="sync-user" class="sr-only"></span></span>
        <button type="button" class="btn btn-ghost btn-sm" id="logout-btn" title="Déconnexion"><span aria-hidden="true" class="show-narrow">⏻</span><span class="vh-narrow">Déconnexion</span></button>
    </div>
</header>

<main id="main" class="app-main" tabindex="-1">
    <section id="view-suivi" class="view" aria-label="Suivi projet" hidden></section>
</main>

<section id="login" class="login" aria-live="polite">
    <div class="login-box">
        <h1><svg aria-hidden="true"><use href="#icon-clock"/></svg>TIME-WORK</h1>
        <p id="login-msg" class="login-msg">Chargement…</p>
        <button type="button" id="login-btn" class="btn btn-primary" hidden>Se connecter avec Google</button>
        <p id="login-err" class="login-err" role="alert"></p>
        <button type="button" id="login-reload" class="btn btn-ghost btn-sm" hidden>Recharger</button>
    </div>
</section>

<dialog id="dlg"></dialog>
<div id="toasts"></div>
</body>
</html>
