<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>EstIA - App</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #map { width: 100%; height: 100vh; z-index: 1; }
    
    .top-bar { position: absolute; top: env(safe-area-inset-top, 20px); left: 12px; right: 12px; z-index: 1000; display: flex; gap: 8px; }
    .btn-action { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border: none; border-radius: 20px; padding: 12px 16px; font-weight: 600; font-size: 14px; color: #007AFF; box-shadow: 0 4px 15px rgba(0,0,0,0.15); cursor: pointer; display: flex; align-items: center; justify-content: center; flex: 1; }
    .btn-locate { width: 48px; flex: none; border-radius: 50%; font-size: 18px; padding: 0; }

    .sheet { position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(25px); border-radius: 24px 24px 0 0; padding: 16px 20px calc(20px + env(safe-area-inset-bottom)); box-shadow: 0 -5px 25px rgba(0,0,0,0.2); transform: translateY(calc(100% - 70px)); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); max-height: 80vh; overflow-y: auto; }
    .sheet.open { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 5px; background: #C7C7CC; border-radius: 3px; margin: 0 auto 12px auto; }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .sheet-title { font-size: 18px; font-weight: 700; margin: 0; }
    
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; background: #E5F1FF; color: #007AFF; }
    .annonce-badge { background: #FF3B30; color: white; display: none; margin-top: 5px; }

    .projection-box { margin-top: 15px; background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%); color: white; border-radius: 16px; padding: 16px; }
    .projection-val { font-size: 24px; font-weight: 800; margin: 6px 0; }
    .slider { width: 100%; margin-top: 10px; accent-color: #34C759; }
    .slider-labels { display: flex; justify-content: space-between; font-size: 11px; opacity: 0.8; }

    .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .card { background: #FFF; border-radius: 14px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.05); }
    .card-label { font-size: 11px; color: #8E8E93; text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
    .card-value { font-size: 15px; font-weight: 700; color: #1C1C1E; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="top-bar">
    <button class="btn-action btn-locate" onclick="locateUser()">📍</button>
    <button class="btn-action" onclick="toggleSheet()">📊 Voir l'analyse du secteur</button>
  </div>

  <div class="sheet" id="bottomSheet">
    <div class="sheet-handle" onclick="toggleSheet()"></div>
    <div class="sheet-header">
      <div>
        <h2 class="sheet-title" id="addrTitle">Cliquez sur la carte...</h2>
        <div id="addrSub" style="font-size: 12px; color: #8E8E93;">Position cible</div>
        <span class="badge annonce-badge" id="annonceInfo">Annonce ciblée</span>
      </div>
      <span class="badge" id="pluBadge">PLU : --</span>
    </div>

    <div class="projection-box">
      <div style="font-size: 14px; font-weight: 600; opacity: 0.9;">📈 Projection de valeur</div>
      <div class="projection-val" id="projectedPrice">-- €</div>
      <input type="range" min="0" max="10" value="0" step="1" class="slider" id="yearSlider" oninput="updateProjection()">
      <div class="slider-labels">
        <span>Aujourd'hui</span><span>+3 ans</span><span>+5 ans</span><span>+10 ans</span>
      </div>
    </div>

    <div class="grid-stats">
      <div class="card"><div class="card-label">Prix DVF Secteur</div><div class="card-value" id="dvfPrice">--</div></div>
      <div class="card"><div class="card-label">Parcelle Cadastre</div><div class="card-value" id="cadastreRef">--</div></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Initialisation sur Péchabou
    const map = L.map('map', { zoomControl: false }).setView([43.5361, 1.5162], 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_2mlz_1_7ac8b31ef1e91214f32992d4', { maxZoom: 19 }).addTo(map);

    let currentBasePrice = 0;
    let currentMarker = null;
    let isAnnonceMode = false;
    let annonceTotalValue = 0;

    // Chargement des fausses annonces scrapées
    async function loadAnnonces() {
      try {
        const res = await fetch('annonces.json');
        const annonces = await res.json();
        
        annonces.forEach(a => {
          const marker = L.circleMarker([a.lat, a.lng], {
            radius: 8, fillColor: "#FF3B30", color: "#fff", weight: 2, opacity: 1, fillOpacity: 0.9
          }).addTo(map);
          
          marker.bindPopup(`<b>${a.titre}</b><br>${a.prix.toLocaleString()} € - ${a.surface} m²<br><br><button onclick="selectAnnonce(${a.lat}, ${a.lng}, ${a.prix}, '${a.titre}')">Analyser cette annonce</button>`);
        });
      } catch(e) { console.log("Fichier annonces.json non trouvé."); }
    }

    // Fonction si on clique sur le bouton d'une annonce
    window.selectAnnonce = function(lat, lng, prix, titre) {
      isAnnonceMode = true;
      annonceTotalValue = prix;
      currentBasePrice = prix; // On base la plus value sur le vrai prix
      
      document.getElementById('annonceInfo').style.display = 'inline-block';
      document.getElementById('annonceInfo').innerText = `En vente : ${titre}`;
      document.getElementById('addrTitle').innerText = titre;
      
      handleLocationSelect(lat, lng, true);
    }

    // Gestion du clic normal sur la carte
    map.on('click', function(e) {
      isAnnonceMode = false;
      document.getElementById('annonceInfo').style.display = 'none';
      handleLocationSelect(e.latlng.lat, e.latlng.lng, false);
    });

    async function handleLocationSelect(lat, lng, isAnnonce) {
      document.getElementById('bottomSheet').classList.add('open');
      if(currentMarker) map.removeLayer(currentMarker);
      currentMarker = L.marker([lat, lng]).addTo(map);

      // Appels API simplifiés
      fetch(`https://apicarto.ign.fr/api/cadastre/parcelle?lon=${lng}&lat=${lat}`)
        .then(r => r.json())
        .then(d => {
          if(d.features?.length > 0) document.getElementById('cadastreRef').innerText = d.features[0].properties.numero;
        }).catch(() => document.getElementById('cadastreRef').innerText = "--");

      fetch(`https://dvf-api.etalab.gouv.fr/v1/mutations/?lat=${lat}&lon=${lng}&dist=300`)
        .then(r => r.json())
        .then(d => {
          let avg = 3000;
          if(d.mutations?.length > 0) {
            let tot = 0, cnt = 0;
            d.mutations.forEach(m => { if(m.valeur_fonciere && m.surface_reelle_bati) { tot += m.valeur_fonciere/m.surface_reelle_bati; cnt++; }});
            if(cnt > 0) avg = tot/cnt;
          }
          document.getElementById('dvfPrice').innerText = `${Math.round(avg).toLocaleString()} € / m²`;
          
          if(!isAnnonce) {
            currentBasePrice = avg;
          }
          updateProjection();
        });

      fetch(`https://apicarto.ign.fr/api/gpu/zone-urba?lon=${lng}&lat=${lat}`)
        .then(r => r.json())
        .then(d => {
          document.getElementById('pluBadge').innerText = (d.features?.length > 0) ? `PLU : Zone ${d.features[0].properties.libelle}` : "PLU: ND";
        });
    }

    window.updateProjection = function() {
      const years = parseInt(document.getElementById('yearSlider').value);
      const rate = 0.025;
      const projected = Math.round(currentBasePrice * Math.pow((1 + rate), years));
      
      const suffix = isAnnonceMode ? "€ (Valeur globale)" : "€ / m²";
      document.getElementById('projectedPrice').innerText = `${projected.toLocaleString()} ${suffix}`;
    }

    function toggleSheet() { document.getElementById('bottomSheet').classList.toggle('open'); }
    function locateUser() { navigator.geolocation.getCurrentPosition(p => map.setView([p.coords.latitude, p.coords.longitude], 17)); }
    
    // Lancement
    loadAnnonces();
  </script>
</body>
</html>
